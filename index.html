<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKKMonkey development</title>
    <style>
      body {
        max-width: 48rem;
        margin: 3rem auto;
        padding: 0 1rem;
        font: 1rem/1.6 system-ui;
      }
      textarea,
      input,
      [contenteditable] {
        box-sizing: border-box;
        width: 100%;
        margin: 1rem 0;
        padding: 0.75rem;
        border: 1px solid #aaa;
      }
      textarea,
      [contenteditable] {
        min-height: 8rem;
      }
    </style>
  </head>
  <body>
    <h1>SKKMonkey</h1>
    <p>Ctrl+JでSKKを有効にします。開発ページでは内蔵の小辞書を使用します。</p>
    <label>Textarea<textarea aria-label="Textarea"></textarea></label>
    <label>Input<input aria-label="Input" /></label>
    <div contenteditable="true" role="textbox" aria-label="Rich text">編集可能なテキスト</div>
    <div id="menu" aria-label="Userscript menu"></div>
    <script type="module" src="/dev.ts"></script>
  </body>
</html>
